# Render Blueprint - https://render.com/docs/blueprint-spec
# Deploys the API + built frontend as a single Docker web service with managed Postgres.
databases:
  - name: deconstruct-db
    databaseName: deconstruct
    user: deconstruct
    plan: free
    region: oregon

services:
  - type: web
    name: deconstruct
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    # Runs before each release, using the built image
    preDeployCommand: npm run prisma:deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: deconstruct-db
          property: connectionString
      # Set these in the Render dashboard (secrets are never committed).
      # Provide the key for whichever AI_PROVIDER you select above.
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
