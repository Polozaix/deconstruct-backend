# Local development database.
#   docker compose up -d
# then set DATABASE_URL in .env to the value in .env.example.
services:
  db:
    image: postgres:16-alpine
    container_name: deconstruct-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: deconstruct
      POSTGRES_PASSWORD: deconstruct
      POSTGRES_DB: deconstruct
    ports:
      - "5432:5432"
    volumes:
      - deconstruct-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deconstruct -d deconstruct"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  deconstruct-db-data:
